[package]
name = "kamfany-mail"
version = "0.1.0"
edition = "2024"
description = "API for KAMFANY Mail"
publish = false

[dependencies]
ammonia = "4.2.5"
anyhow = "1.0.104"
argon2 = { version = "0.6.0", features = ["rand_core"] }
axum = { version = "0.8.9", features = ["multipart", "ws"] }
futures-util = "0.3.34"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
getrandom = { version = "0.4.3", features = ["std", "sys_rng"] }
hmac = "0.13.0"
object_store = { version = "0.14.2", features = ["aws"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "migrate", "tls-rustls", "chrono", "uuid"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.2", features = ["serde", "v4"] }
calamine = "0.38.0"

[dev-dependencies]
http-body-util = "0.1.5"
